<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cart | Kanwood Interiors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=e1">
</head>
<body data-page="cart" data-root="">
  <div id="siteHead"></div>
  <div class="pagehead">
    <div class="wrap">
      <div class="crumb"><a href="index.html">Home</a> / Enquiry list</div>
      <h1>Enquiry list</h1>
    </div>
  </div>
  <section class="sec">
    <div class="wrap">
      <div class="empty" id="cartEmpty" style="display:none;">
        <h2>Your enquiry list is empty</h2>
        <p style="color:var(--mute);margin:10px 0 18px;">Add products, then send an enquiry. No online payment.</p>
        <a class="btn btn-red" href="product.html">Browse catalogue</a>
      </div>
      <div class="cart-layout" id="cartLayout">
        <div class="cart-box">
          <h3 style="margin-bottom:8px;">Items</h3>
          <div id="cartItems"></div>
        </div>
        <aside class="summary">
          <h3>Quote summary</h3>
          <div class="sum-row"><span>Catalogue value</span><b id="subTotal">₹0</b></div>
          <div class="sum-row"><span>Payment</span><b id="shipFee">Enquiry only</b></div>
          <div class="sum-row" style="border-top:1px solid var(--line);padding-top:10px;font-size:16px;"><span>Indicative MRP</span><b id="grandTotal">₹0</b></div>
          <form id="cartEnquiry" style="margin-top:14px;">
            <div class="field"><label>Name</label><input id="enqName" required placeholder="Your name"></div>
            <div class="field"><label>Email</label><input id="enqEmail" type="email" required placeholder="you@email.com"></div>
            <div class="field"><label>Phone</label><input id="enqPhone" type="tel" required placeholder="+91 98111 67816"></div>
            <div class="field"><label>Message</label><textarea id="enqMsg" placeholder="City, quantity, finish…"></textarea></div>
            <button class="btn btn-red" type="submit" style="width:100%;">Send Enquiry</button>
            <p class="note" id="cartNote"></p>
          </form>
          <p style="font-size:12px;color:var(--mute);margin-top:10px;">No checkout. We confirm by phone or email: +91 98111 67816</p>
        </aside>
      </div>
    </div>
  </section>
  <div id="siteFoot"></div>
  <script src="js/main.js?v=e1"></script>
</body>
</html>
